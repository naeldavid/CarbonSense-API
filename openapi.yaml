openapi: 3.0.0
info:
  title: CarbonSense API
  description: Fast, reliable, and affordable carbon emissions calculations. Built with latest IPCC 2023 standards.
  version: 1.0.0
  contact:
    name: Support
    email: aw2rn4ikr@mozmail.com
  license:
    name: MIT

servers:
  - url: http://localhost:3000
    description: Development server
  - url: https://carbon-sense-api.vercel.app
    description: Production server

paths:
  /api/transportation/calculate:
    post:
      summary: Calculate transportation emissions
      tags:
        - Transportation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - distance
                - method
              properties:
                distance:
                  type: number
                  example: 100
                  description: Distance traveled
                method:
                  type: string
                  example: car-gasoline
                  description: Transportation method (car-gasoline, car-diesel, flight, train, bus, ferry, shipping)
                distanceUnit:
                  type: string
                  enum: [km, miles]
                  default: km
      responses:
        200:
          description: Successful calculation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalculationResponse'
        400:
          description: Invalid request

  /api/transportation/factors:
    get:
      summary: Get available transportation methods
      tags:
        - Transportation
      responses:
        200:
          description: List of transportation methods with factors

  /api/energy/calculate:
    post:
      summary: Calculate energy consumption emissions
      tags:
        - Energy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - consumption
                - type
              properties:
                consumption:
                  type: number
                  example: 1000
                  description: Energy consumed
                type:
                  type: string
                  example: grid
                  description: Energy type (grid, renewable, gas, oil, coal)
                unit:
                  type: string
                  enum: [kWh, MWh, J, kJ, MJ]
                  default: kWh
      responses:
        200:
          description: Successful calculation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalculationResponse'

  /api/energy/factors:
    get:
      summary: Get available energy types
      tags:
        - Energy
      responses:
        200:
          description: List of energy types with factors

  /api/products/calculate:
    post:
      summary: Calculate product manufacturing emissions
      tags:
        - Products
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - quantity
                - product
              properties:
                quantity:
                  type: number
                  example: 10
                  description: Quantity
                product:
                  type: string
                  example: steel
                  description: Product type (steel, aluminum, plastic, concrete, clothing)
                unit:
                  type: string
                  enum: [kg, ton, m2, unit]
                  default: kg
      responses:
        200:
          description: Successful calculation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalculationResponse'

  /api/products/factors:
    get:
      summary: Get available product types
      tags:
        - Products
      responses:
        200:
          description: List of product types with factors

  /health:
    get:
      summary: API health check
      tags:
        - Health
      responses:
        200:
          description: API is healthy

components:
  schemas:
    CalculationResponse:
      type: object
      properties:
        activityType:
          type: string
          example: Car Travel (Gasoline)
        emissionsCO2e:
          type: number
          example: 19.2
          description: Emissions in kg CO2e
        unit:
          type: string
          example: kg CO2e
        standard:
          type: string
          example: IPCC_2023
        breakDownByComponent:
          type: object
          example:
            Direct emissions: 19.2
        offsetRecommendations:
          type: array
          items:
            type: string
        timestamp:
          type: string
          format: date-time

  securitySchemes:
    ApiKeyHeader:
      type: apiKey
      in: header
      name: X-API-Key
    ApiKeyQuery:
      type: apiKey
      in: query
      name: api_key

security:
  - ApiKeyHeader: []
  - ApiKeyQuery: []
